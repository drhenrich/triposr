; PlatformIO-Projekt fuer den ESP32-S3.
;
;   pio run -t upload       Firmware flashen
;   pio device monitor      Serielle Ausgabe
;   make -C test/native     Logiktests auf dem PC (ohne Hardware)
;
; Die Version von platform-espressif32 ist gepinnt, weil die LEDC-API
; (ledcAttach / ledcChangeFrequency mit Pin statt Kanal) erst ab
; arduino-esp32 3.x so aussieht.

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@^3.20017.0

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1
build_unflags = -std=gnu++11

lib_deps =
    teemuatlut/TMCStepper@^0.7.3

; Die hardwareunabhaengige Logik wird nativ getestet, nicht auf dem Target -
; siehe test/native/Makefile.
test_ignore = native
