; PlatformIO-Projekt fuer den ESP32-S3.
;
;   pio run -e usb        Firmware mit USB-C (NCM) und WLAN
;   pio run -e wifi       nur WLAN, ohne den ESP-IDF-Teil - baut schneller
;   pio run -t upload
;   pio device monitor
;   make -C test/native   Logiktests auf dem PC (ohne Hardware)
;
; Warum zwei Umgebungen: fuer USB-Ethernet (CDC-NCM) wird `esp_tinyusb` aus
; ESP-IDF gebraucht, das der Arduino-Core allein nicht herausfuehrt. Deshalb
; laeuft `usb` mit Arduino *als IDF-Komponente* - dadurch bleiben die
; Arduino-APIs nutzbar. Wer nur WLAN will, nimmt `wifi` und spart sich die
; IDF-Toolchain.

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed = 921600
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=1

; Eine einzige Fremdbibliothek fuer das Netz: der WebSocket-Server, ueber den
; die Punkte an den Browser gehen. HTTP bringt der ESP32-Core selbst mit
; (WebServer.h). Dazu EspUsbHost fuer den LiDAR am USB-Host-Port.
;
; Der STS3215 kommt bewusst ohne Bibliothek aus - er wird direkt ueber sein
; Busprotokoll angesprochen (feetech_bus.h), damit die Paketlogik nativ
; testbar bleibt. Dasselbe gilt fuer das Slamtec-Protokoll des LiDAR.
; EspUsbHost fehlt hier absichtlich: gebraucht wird sie nur, wenn der C1 ueber
; seinen USB-Adapter am USB-Host-Port haengt (LIDAR_LINK_USB=1). Beim direkten
; Anschluss an die TTL-Pins - dem Normalfall - wird lidar_link_usb.h gar nicht
; erst eingebunden. Wer den USB-Weg will, ergaenzt hier:
;     https://github.com/tanakamasayuki/EspUsbHost.git
lib_deps =
    links2004/WebSockets@^2.4.1

; Die hardwareunabhaengige Logik wird nativ getestet, nicht auf dem Target -
; siehe test/native/Makefile.
test_ignore = native

[env:wifi]
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@^3.20017.0
build_flags =
    ${env.build_flags}
    -DENABLE_USB_NCM=0

[env:usb]
framework = arduino, espidf
build_flags =
    ${env.build_flags}
    -DENABLE_USB_NCM=1
board_build.embed_txtfiles =
; Native USB des ESP32-S3 (GPIO 19/20) als Geraet, nicht als serielle Konsole.
board_build.cmake_extra_args =
    -DCONFIG_TINYUSB_NET_MODE_NCM=y
